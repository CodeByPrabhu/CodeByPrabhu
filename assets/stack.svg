<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">PRABHU technology stack</title>
<desc id="desc">Animated dark navy, electric blue and crimson GitHub profile graphic for PRABHU.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#11182a"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff" stop-opacity=".35"/><stop offset="1" stop-color="#ff354f" stop-opacity=".24"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7fa8ff" opacity=".18"/></pattern>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect x="0" y="0" width="1200" height="350" rx="28"/></clipPath>
</defs>
<style>
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .sans{font-family:Inter,Arial,sans-serif}
  .muted{fill:#a9b7d0}
  .white{fill:#f5f7ff}
  .blue{fill:#60a5ff}
  .red{fill:#ff6478}
  .small{font-size:17px}
  .label{font-size:13px;letter-spacing:3px;font-weight:700}
  @media (prefers-reduced-motion: reduce) { .motion { animation:none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="350" rx="28" fill="url(#bg)"/>
<rect width="1200" height="350" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="348" rx="27" fill="none" stroke="url(#line)" stroke-opacity=".7" stroke-width="2"/>

<text x="48" y="55" class="mono blue label">02 / TOOLKIT</text>
<text x="48" y="103" class="sans white" font-size="34" font-weight="800">Technologies I'm exploring</text>
<text x="50" y="138" class="sans muted" font-size="18">A growing toolkit for AI and application development.</text>
<g transform="translate(50 175)">
  <rect width="200" height="92" rx="18" fill="#101a2e" stroke="#247bff" stroke-opacity=".8"/>
  <text x="100" y="39" text-anchor="middle" class="sans white" font-size="25" font-weight="700">Python</text>
  <text x="100" y="65" text-anchor="middle" class="mono blue" font-size="13">AI / LOGIC</text>
</g>
<g transform="translate(275 175)">
  <rect width="200" height="92" rx="18" fill="#101a2e" stroke="#ff354f" stroke-opacity=".8"/>
  <text x="100" y="39" text-anchor="middle" class="sans white" font-size="25" font-weight="700">Flutter</text>
  <text x="100" y="65" text-anchor="middle" class="mono red" font-size="13">MOBILE APPS</text>
</g>
<g transform="translate(500 175)">
  <rect width="200" height="92" rx="18" fill="#101a2e" stroke="#247bff" stroke-opacity=".8"/>
  <text x="100" y="39" text-anchor="middle" class="sans white" font-size="25" font-weight="700">JavaScript</text>
  <text x="100" y="65" text-anchor="middle" class="mono blue" font-size="13">WEB</text>
</g>
<g transform="translate(725 175)">
  <rect width="200" height="92" rx="18" fill="#101a2e" stroke="#ff354f" stroke-opacity=".8"/>
  <text x="100" y="39" text-anchor="middle" class="sans white" font-size="25" font-weight="700">HTML</text>
  <text x="100" y="65" text-anchor="middle" class="mono red" font-size="13">STRUCTURE</text>
</g>
<g transform="translate(950 175)">
  <rect width="200" height="92" rx="18" fill="#101a2e" stroke="#247bff" stroke-opacity=".8"/>
  <text x="100" y="39" text-anchor="middle" class="sans white" font-size="25" font-weight="700">CSS</text>
  <text x="100" y="65" text-anchor="middle" class="mono blue" font-size="13">STYLING</text>
</g>
<path d="M100 300 Q600 340 1100 300" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"/>
<circle cx="600" cy="321" r="5" fill="#60a5ff"><animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/></circle>

</g>
</svg>