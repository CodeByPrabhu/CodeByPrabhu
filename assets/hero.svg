
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">PRABHU — AI and App Developer</title>
  <desc id="desc">Animated neon introduction for CodeByPrabhu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10152b"/>
      <stop offset="100%" stop-color="#090b13"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8290b8" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" rx="22" fill="url(#bg)"/>
  <rect width="900" height="360" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="896" height="356" rx="20" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8"/>

  <circle cx="730" cy="110" r="90" fill="#6d5dfc" opacity=".08">
    <animate attributeName="r" values="75;105;75" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="110" r="62" fill="none" stroke="#00e5ff" stroke-opacity=".55">
    <animate attributeName="r" values="55;72;55" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="110" r="42" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 730 110" to="360 730 110" dur="24s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".9">
    <path d="M690 110l-18 0 0 20 -24 0"/>
    <path d="M770 110l20 0 0 24 25 0"/>
    <path d="M730 68V48h28"/>
    <circle cx="648" cy="130" r="4" fill="#00e5ff"/>
    <circle cx="815" cy="134" r="4" fill="#ffb347"/>
    <circle cx="758" cy="48" r="4" fill="#a78bfa"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="62" fill="#00e5ff" font-size="13" letter-spacing="4">CODEBYPRABHU</text>
    <path d="M56 78H300" stroke="url(#neon)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 244;244 0;0 244" dur="5s" repeatCount="indefinite"/>
    </path>

    <text x="54" y="157" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="2">PRABHU</text>
    <text x="58" y="195" fill="#b7c5e7" font-size="19">AI &amp; App Developer</text>

    <text x="58" y="235" fill="#00e5ff" font-size="14" letter-spacing="1.5">BUILD  •  CREATE  •  INNOVATE</text>
    <text x="58" y="270" fill="#cbd5e1" font-size="14">Exploring AI, apps and new technology.</text>

    <rect x="58" y="297" width="150" height="34" rx="8" fill="#121d30" stroke="#00e5ff" stroke-opacity=".7"/>
    <text x="133" y="319" text-anchor="middle" fill="#eafaff" font-size="12" font-weight="700">JARVIS AI</text>

    <text x="235" y="319" fill="#8b9bbd" font-size="12">PYTHON  /  FLUTTER  /  JS</text>
  </g>

  <g fill="#00e5ff">
    <circle cx="590" cy="70" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="220" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="280" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="monospace" font-size="12" fill="#8b9bbd" opacity=".8">
    <text x="610" y="210">&lt; AI /&gt;</text>
    <text x="760" y="265">{ code }</text>
    <text x="570" y="315">01001 10110</text>
  </g>
</svg>
