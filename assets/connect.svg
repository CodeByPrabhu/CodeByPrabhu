  .white{fill:#f5f7ff}
  .blue{fill:#60a5ff}
  .red{fill:#ff6478}
  .small{font-size:17px}
  .label{font-size:13px;letter-spacing:3px;font-weight:700}
  @media (prefers-reduced-motion: reduce) { .motion { animation:none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="365" rx="28" fill="url(#bg)"/>
<rect width="1200" height="365" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="363" rx="27" fill="none" stroke="url(#line)" stroke-opacity=".7" stroke-width="2"/>

