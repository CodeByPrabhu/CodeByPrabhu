<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">PRABHU — animated profile hero</title>
<desc id="desc">Animated dark navy, electric blue and crimson GitHub profile graphic for PRABHU.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#11182a"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff" stop-opacity=".35"/><stop offset="1" stop-color="#ff354f" stop-opacity=".24"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7fa8ff" opacity=".18"/></pattern>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect x="0" y="0" width="1200" height="370" rx="28"/></clipPath>
</defs>
<style>
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .sans{font-family:Inter,Arial,sans-serif}
  .muted{fill:#a9b7d0}
  .white{fill:#f5f7ff}
  .blue{fill:#60a5ff}
  .red{fill:#ff6478}
  .small{font-size:17px}
  .label{font-size:13px;letter-spacing:3px;font-weight:700}
  @media (prefers-reduced-motion: reduce) { .motion { animation:none !important; } }
</style>
<g clip-path="url(#round)">
<rect width="1200" height="370" rx="28" fill="url(#bg)"/>
<rect width="1200" height="370" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="368" rx="27" fill="none" stroke="url(#line)" stroke-opacity=".7" stroke-width="2"/>

<circle cx="1010" cy="174" r="125" fill="url(#glow)" class="motion">
  <animate attributeName="r" values="118;132;118" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="1010" cy="174" r="93" fill="#0d1425" stroke="#247bff" stroke-opacity=".7" stroke-width="2"/>
<circle cx="1010" cy="174" r="77" fill="#111b30" stroke="#ff354f" stroke-opacity=".6" stroke-width="1.5"/>
<!-- Neutral illustrated avatar placeholder; replace with id.png after portrait is supplied -->
<circle cx="1010" cy="143" r="29" fill="#d6e1f7"/>
<path d="M952 221 Q958 174 1010 174 Q1062 174 1068 221 Z" fill="#182943" stroke="#60a5ff" stroke-width="2"/>
<path d="M982 127 Q1010 97 1038 127 L1035 142 Q1010 123 985 142 Z" fill="#101827"/>
<text x="64" y="63" class="mono blue label">CODEBYPRABHU / PROFILE</text>
<text x="60" y="150" class="sans white" font-size="70" font-weight="800">HEY, I'M <tspan fill="#60a5ff">PRABHU</tspan></text>
<rect x="63" y="174" width="510" height="3" rx="2" fill="url(#line)"/>
<text x="64" y="218" class="mono white" font-size="24">AI &amp; APP DEVELOPER</text>
<text x="64" y="253" class="sans muted" font-size="19">Building ideas into useful digital experiences.</text>
<text x="64" y="300" class="mono small muted">TAMIL NADU, INDIA</text>
<g transform="translate(64 322)">
  <rect width="112" height="25" rx="12" fill="#13284a" stroke="#247bff" stroke-opacity=".7"/>
  <text x="56" y="17" text-anchor="middle" class="mono blue" font-size="12">AI BUILDER</text>
  <rect x="124" width="150" height="25" rx="12" fill="#2b1725" stroke="#ff354f" stroke-opacity=".7"/>
  <text x="199" y="17" text-anchor="middle" class="mono red" font-size="12">APP DEVELOPER</text>
</g>
<path d="M585 58 L605 58 L605 300 L585 300" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"/>
<text x="650" y="70" class="mono muted label">CURRENT FOCUS</text>
<text x="650" y="112" class="sans white" font-size="25" font-weight="700">Jarvis AI</text>
<text x="650" y="145" class="sans muted" font-size="17">Personal AI assistant project</text>
<circle cx="653" cy="190" r="5" fill="#247bff"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
<text x="670" y="196" class="mono muted" font-size="15">LEARN • BUILD • ITERATE</text>

</g>
</svg>